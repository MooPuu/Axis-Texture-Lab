[package]
name = "axis-texture-lab"
version = "2.0.0"
description = "Axis Texture Lab - Native PBR Texture & Terrain Suite"
authors = ["Axis Tools"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rfd = "0.15"
