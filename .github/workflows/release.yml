name: Build Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to upload to'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Universal macOS Bundle
        run: npx tauri build --target universal-apple-darwin

      - name: Package macOS release assets
        run: |
          mkdir -p macos-artifacts
          # Copy DMG
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -exec cp {} macos-artifacts/AxisTextureLab-v2.0.0-macos-universal.dmg \;
          # Package or copy .app.tar.gz
          if find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" | grep -q .; then
            find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" -exec cp {} macos-artifacts/AxisTextureLab-v2.0.0-macos-universal.app.tar.gz \;
          else
            tar -czvf macos-artifacts/AxisTextureLab-v2.0.0-macos-universal.app.tar.gz -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "Axis Texture Lab.app"
          fi
          ls -la macos-artifacts/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.release_tag }} macos-artifacts/* --clobber

  build-linux:
    name: Build Linux (AppImage & Deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev squashfs-tools

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Linux Bundles
        run: npx tauri build

      - name: Package Linux release assets
        run: |
          mkdir -p linux-artifacts
          # Copy AppImage
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} linux-artifacts/AxisTextureLab-v2.0.0-linux-x86_64.AppImage \;
          # Copy DEB
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} linux-artifacts/AxisTextureLab-v2.0.0-linux-amd64.deb \;
          # Create standalone tarball of binary
          tar -czvf linux-artifacts/AxisTextureLab-v2.0.0-linux-x86_64.tar.gz -C src-tauri/target/release axis-texture-lab
          ls -la linux-artifacts/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.release_tag }} linux-artifacts/* --clobber
